<!DOCTYPE html>
<html lang="nl-BE">
    <head>
        <meta charset="UTF-8">
        <title>Game - Mijn Website</title>
        <link rel="stylesheet" href="../CSS/Styles.css">
        <script src="../JS/App.js" defer></script>
    </head>
    <body>
        <!-- Header -->
        <header>
            <img src="../Media/logo.png" alt="logo" height="50">
            <h1>Welkom op mijn website!</h1>
        </header>

        <!-- Navigation -->
        <nav>
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="game.html">Game</a>
        </nav>
        

        <!-- Main Content -->
<main>
        <h2>Game Pagina</h2>

        <button onclick="startGame()">Start spel</button>
        <br><br>

        <label for="name">Naam invoeren:</label><br>
        <input type="text" id="name" placeholder="Jouw naam">
        <button onclick="saveName()">Bevestigen</button>
        <p id="welcome"></p>

        <br>

        <label for="difficulty">Kies niveau:</label><br>
        <select id="difficulty" onchange="setDifficulty()">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>
        <p id="level"></p>

        <br>

        <input type="checkbox" id="akkoord">
        <label for="akkoord">Ik ga akkoord met de spelregels</label>
        <br><br>

        <label for="scoreInput">Vul je score in:</label><br>
        <input type="number" id="scoreInput" placeholder="Score">
        <button onclick="checkScore()">Check score</button>
        <p id="scoreResult"></p>

        <hr>

        <h3>De Fun Zone</h3>
        
        <p>Probeer op deze knop te drukken:</p>
        <div id="speelveld">
            <button id="wegrenKnop" onmouseover="ontwijkKnop()" style="background-color:
             orange; color: black;">Klik mij! 🏃‍♂️</button>
        </div>

        <p>Dupliceer tot max 20 knoppen:</p>
        <div id="knopContainer">
            <button onclick="dupliceerKnop()" style="background-color: #00ffcc;
             color: black;">Klik om te dupliceren (1) 🪄</button>
        </div>
    </main>
  

        <!-- Footer -->
        <footer>
            <table border="1">
                <tr>
                    <th>School</th>
                    <td>GO! Campus Het Spoor!</td>
                </tr>
                <tr>
                    <th>Adres</th>
                    <td>Begonialaan 34, 2400 Mol</td>
                </tr>
            </table>
        </footer>
    </body>
</html>
