<!DOCTYPE html>
<html lang="nl-BE">
    <head>
        <meta charset="UTF-8">
        <title>Game - Mijn Website</title>
        <link rel="stylesheet" href="../CSS/Styles.css">
    </head>
    <body>
        <!-- Header -->
        <header>
            <img src="Media/logo.png" alt="logo" height="50">
            <h1>Welkom op mijn website!</h1>
        </header>

        <!-- Navigation -->
        <nav>
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="game.html">Game</a>
        </nav>

        <!-- Main Content -->
        <main>
            <h2>Game pagina</h2>
            
            <!-- 1 START KNOP -->
            <button onclick="startGame()">Start spel</button>

            <!-- 2 NAAM -->
            <br><br>
            <input type="text" id="name" placeholder="Jouw naam">
            <button onclick="saveName()">Bevestigen</button>
            <h3 id="welcome"></h3>

            <!-- 3 DROPDOWN -->
            <br>
            <select id="difficulty" onchange="setDifficulty()">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            </select>

            <p id="level"></p>

            <!-- 4 CHECKBOX -->
            <label>
            <input type="checkbox" id="agree"> Ik ga akkoord
            </label>
            <!-- 5 INPUT SCORE -->
            <br><br>
            <input type="number" id="scoreInput" placeholder="Score">
            <button onclick="checkScore()">Check score</button>
            
            <p id="scoreResult"></p>
        </main>

        <!-- Footer -->
        <footer>
            <table border="1">
                <tr>
                    <th>School</th>
                    <td>GO! Campus Het Spoor!</td>
                </tr>
                <tr>
                    <th>Adres</th>
                    <td>Begonialaan 34, 2400 Mol</td>
                </tr>
            </table>
        </footer>
    </body>
</html>
